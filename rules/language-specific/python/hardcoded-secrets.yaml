id: cwe-798-hardcoded-secrets-python
taxonomy:
  - owasp: A07:2021
  - cwe: CWE-798
title: Hardcoded Secrets and Credentials in Source
severity: high
languages:
  - python
frameworks: []
description: |
  API keys, passwords, tokens, and cryptographic secrets embedded as string
  literals in source code are exposed to anyone with repository access and
  persist in git history even after removal. Vibe-coded apps frequently ship
  placeholder or real credentials copied straight from provider dashboards.
detection_criteria: |
  Flag string literals assigned to secret-shaped names or passed as
  credential parameters:
  - variables named *_key, *_secret, *_token, *_password, api_key
    assigned non-empty literals
  - connection strings with embedded passwords (postgres://user:pass@...)
  - known credential formats: "sk-", "AKIA" access key ids, "ghp_", "xoxb-",
    PEM private key blocks, AWS secret access keys
  - default fallbacks like os.environ.get("API_KEY", "actual-key-here")
  Non-secret configuration is NOT a finding: region names (AWS_REGION,
  AWS_DEFAULT_REGION), profile names (AWS_PROFILE), hostnames, or bucket
  names without embedded credentials.
  Reading from environment variables or a secrets manager without a literal
  fallback is the safe pattern.
example_vulnerable: |
  STRIPE_API_KEY = "sk_live_51Hxxxxxxxxxxxxxxxxxxxxxx"
  db_url = "postgres://admin:hunter2@db.internal:5432/prod"
example_secure: |
  STRIPE_API_KEY = os.environ["STRIPE_API_KEY"]
  db_url = os.environ["DATABASE_URL"]
references:
  - url: https://cwe.mitre.org/data/definitions/798.html
    title: CWE-798 Use of Hard-coded Credentials
  - url: https://owasp.org/Top10/A02_2021-Cryptographic_Failures/
    title: OWASP Top 10 A02 Cryptographic Failures
