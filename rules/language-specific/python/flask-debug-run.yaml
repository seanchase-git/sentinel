id: cwe-489-flask-debug-run
taxonomy:
  - owasp: A05:2021
  - cwe: CWE-489
title: Flask Debug Mode Enabled (Werkzeug Interactive Debugger)
severity: high
languages:
  - python
frameworks:
  - flask
description: |
  Running Flask with debug=True enables the Werkzeug interactive debugger,
  which executes arbitrary Python from the browser on any unhandled
  exception. If reachable by an attacker it is direct remote code execution;
  it also leaks source and environment through tracebacks.
detection_criteria: |
  Flag debug enabled in a way that can reach a deployed environment:
  - app.run(debug=True)
  - app.config["DEBUG"] = True or app.debug = True as a constant
  - FLASK_DEBUG defaulting to on
  Safe: keep debug off by default and gate it behind an environment variable
  used only in local development.
example_vulnerable: |
  if __name__ == "__main__":
      app.run(host="0.0.0.0", debug=True)
example_secure: |
  if __name__ == "__main__":
      app.run(host="127.0.0.1", debug=os.environ.get("FLASK_DEBUG") == "1")
references:
  - url: https://cwe.mitre.org/data/definitions/489.html
    title: CWE-489 Active Debug Code
  - url: https://owasp.org/Top10/A05_2021-Security_Misconfiguration/
    title: OWASP Top 10 A05 Security Misconfiguration
