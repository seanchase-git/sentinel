id: cwe-759-unsalted-password-hash-csharp
taxonomy:
  - owasp: A02:2021
  - cwe: CWE-759
title: Password Hashing Without a Unique Salt
severity: high
languages: [csharp]
frameworks: []
description: |
  A fast unsalted digest gives equal passwords equal hashes and enables reusable
  precomputed attacks across every credential record.
detection_criteria: |
  Flag password input hashed directly with SHA256, SHA512, MD5, SHA1, or another
  general digest without a unique random salt and password-specific work factor.
  ASP.NET Core PasswordHasher, Argon2id, bcrypt, scrypt, or PBKDF2 with unique salt is safe.
example_vulnerable: |
  var hash = SHA256.HashData(Encoding.UTF8.GetBytes(password));
example_secure: |
  var hash = Rfc2898DeriveBytes.Pbkdf2(password, randomSalt, 200_000,
      HashAlgorithmName.SHA256, 32);
references:
  - url: https://learn.microsoft.com/en-us/aspnet/core/security/data-protection/consumer-apis/password-hashing
    title: Microsoft Password Hashing APIs
  - url: https://cwe.mitre.org/data/definitions/759.html
    title: CWE-759 One-Way Hash Without a Salt
