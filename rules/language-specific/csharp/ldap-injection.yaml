id: cwe-90-ldap-injection-csharp
taxonomy:
  - owasp: A03:2021
  - cwe: CWE-90
title: LDAP Filter Injection in .NET
severity: high
languages: [csharp]
frameworks: []
description: |
  Concatenating external text into an LDAP search filter allows filter operators
  and assertions to be injected into directory queries.
detection_criteria: |
  Flag tainted input concatenated or interpolated into DirectorySearcher.Filter,
  SearchRequest filters, or filter text passed to LDAP search operations. Require
  LDAP filter escaping or construction with a safe filter API.
example_vulnerable: |
  searcher.Filter = $"(&(uid={username})(objectClass=user))";
example_secure: |
  searcher.Filter = $"(&(uid={EscapeLdapFilter(username)})(objectClass=user))";
references:
  - url: https://cwe.mitre.org/data/definitions/90.html
    title: CWE-90 LDAP Injection
  - url: https://learn.microsoft.com/en-us/dotnet/api/system.directoryservices.directorysearcher.filter
    title: Microsoft DirectorySearcher.Filter
