id: cwe-22-path-traversal-csharp
taxonomy:
  - owasp: A01:2021
  - cwe: CWE-22
title: Path Traversal in .NET File Access
severity: high
languages: [csharp]
frameworks: []
description: |
  Combining an external path with a trusted directory without canonical containment
  checks permits parent traversal, rooted paths, and alternate separator attacks.
detection_criteria: |
  Flag request-derived paths passed to File, Directory, FileStream, PhysicalFile,
  or Path operations that reach a file access without Path.GetFullPath containment
  under a trusted root. Path.GetFileName alone is only safe for flat-name use.
example_vulnerable: |
  return File.ReadAllText(Path.Combine(root, request.FileName));
example_secure: |
  var full = Path.GetFullPath(Path.Combine(root, request.FileName));
  if (!full.StartsWith(rootWithSeparator, StringComparison.Ordinal)) return Forbid();
  return File.ReadAllText(full);
references:
  - url: https://learn.microsoft.com/en-us/dotnet/api/system.io.path.getfullpath
    title: Microsoft Path.GetFullPath
  - url: https://cwe.mitre.org/data/definitions/22.html
    title: CWE-22 Path Traversal
