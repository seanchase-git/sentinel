id: cwe-798-hardcoded-secrets-csharp
taxonomy:
  - owasp: A02:2021
  - cwe: CWE-798
title: Hardcoded Secret in C# Source
severity: high
languages: [csharp]
frameworks: []
description: |
  Credentials, signing keys, tokens, and private keys embedded as source literals
  are exposed to every source reader and persist in build artifacts and history.
detection_criteria: |
  Flag a secret-like variable or configuration assignment with a substantive C#
  regular, verbatim, interpolated, or raw string literal. Exclude placeholders,
  test-only obvious dummy values, and Environment.GetEnvironmentVariable reads.
example_vulnerable: |
  private const string ApiKey = "prod-secret-7f93c1";
example_secure: |
  private static readonly string ApiKey =
      Environment.GetEnvironmentVariable("SERVICE_API_KEY")!;
references:
  - url: https://learn.microsoft.com/en-us/aspnet/core/security/app-secrets
    title: Microsoft Safe Storage of App Secrets
  - url: https://cwe.mitre.org/data/definitions/798.html
    title: CWE-798 Hard-coded Credentials
