id: cwe-347-jwt-weak-verification-javascript
taxonomy:
  - owasp: A02:2021
  - cwe: CWE-347
title: Improper JWT Verification (alg none, hardcoded, or unverified)
severity: high
languages:
  - javascript
  - typescript
frameworks:
  - express
description: |
  JSON Web Tokens are only as trustworthy as their signature check. Decoding
  without verifying, accepting the "none" algorithm, or signing/verifying
  with a hardcoded or weak secret lets an attacker forge tokens and
  impersonate any user.
detection_criteria: |
  Flag broken JWT handling:
  - jwt.decode(token) used for auth decisions (decode does NOT verify)
  - jwt.verify(token, secret, { algorithms: ['none'] }) or no algorithms pin
  - a hardcoded string secret passed to jwt.sign/verify
  - trusting token claims without a verify call
  Safe: jwt.verify(token, key, { algorithms: ['HS256'] }) (or RS256), with the
  secret/key from the environment and an explicit algorithm allowlist.
example_vulnerable: |
  const payload = jwt.decode(req.headers.authorization);
  if (payload.role === 'admin') grantAccess();
example_secure: |
  const payload = jwt.verify(
    req.headers.authorization, process.env.JWT_SECRET, { algorithms: ['HS256'] });
  if (payload.role === 'admin') grantAccess();
references:
  - url: https://cwe.mitre.org/data/definitions/347.html
    title: CWE-347 Improper Verification of Cryptographic Signature
  - url: https://owasp.org/Top10/A02_2021-Cryptographic_Failures/
    title: OWASP Top 10 A02 Cryptographic Failures
