id: cwe-798-hardcoded-secrets-javascript
taxonomy:
  - owasp: A07:2021
  - cwe: CWE-798
title: Hardcoded Secrets and Credentials in JavaScript/TypeScript
severity: high
languages:
  - javascript
  - typescript
frameworks: []
description: |
  API keys, tokens, and passwords written as string literals ship to anyone
  with source access and persist in git history. In frontend/Next.js code
  they are additionally served to the browser, exposing them to every user.
detection_criteria: |
  Flag literal secrets:
  - const apiKey = "sk-...", const password = "...", token: "xoxb-..."
  - connection strings with embedded passwords (mongodb://user:pass@...)
  - known formats: "sk_live_", "AKIA", "ghp_", "AIza", private key blocks
  - secrets in NEXT_PUBLIC_* values (exposed to the client bundle)
  Safe: read from process.env (server-side) or a secrets manager, with no
  literal fallback value.
example_vulnerable: |
  const stripe = new Stripe("sk_live_51HxxxxxxxxxxxxxxxxxxxxxxABCD");
example_secure: |
  const stripe = new Stripe(process.env.STRIPE_SECRET_KEY);
references:
  - url: https://cwe.mitre.org/data/definitions/798.html
    title: CWE-798 Use of Hard-coded Credentials
  - url: https://owasp.org/Top10/A07_2021-Identification_and_Authentication_Failures/
    title: OWASP Top 10 A07
