id: cwe-22-path-traversal-javascript-sendfile
taxonomy:
  - owasp: A01:2021
  - cwe: CWE-22
title: Path Traversal via User-Controlled File Paths in Node.js
severity: high
languages:
  - javascript
  - typescript
frameworks:
  - express
description: |
  Joining user input into a filesystem path lets an attacker use ../
  sequences or absolute paths to read files outside the intended directory —
  source, configuration, or credentials. path.join does not neutralize ..,
  and res.sendFile without a root option trusts the caller's path.
detection_criteria: |
  Flag filesystem access whose path derives from request data:
  - fs.readFile(path.join(dir, req.params.name), ...)
  - res.sendFile(baseDir + req.query.file)
  - fs.createReadStream on a user-built path
  Safe pattern: resolve the candidate and verify it stays within the base
  directory (path.resolve + startsWith check), or use res.sendFile(name,
  { root: baseDir }) which rejects traversal.
example_vulnerable: |
  app.get('/download', (req, res) => {
    res.sendFile(path.join(UPLOAD_DIR, req.query.file));
  });
example_secure: |
  app.get('/download', (req, res) => {
    res.sendFile(req.query.file, { root: UPLOAD_DIR }, (err) => {
      if (err) res.sendStatus(400);
    });
  });
references:
  - url: https://cwe.mitre.org/data/definitions/22.html
    title: CWE-22 Path Traversal
  - url: https://owasp.org/Top10/A01_2021-Broken_Access_Control/
    title: OWASP Top 10 A01 Broken Access Control
