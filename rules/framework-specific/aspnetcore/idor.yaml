id: cwe-639-idor-aspnetcore
taxonomy:
  - owasp: A01:2021
  - cwe: CWE-639
title: ASP.NET Core IDOR Without Ownership Enforcement
severity: high
languages: [csharp]
frameworks: [aspnetcore]
description: |
  Looking up or modifying an object solely by a caller-controlled identifier
  without tenant, owner, or permission enforcement permits cross-user access.
detection_criteria: |
  Flag an endpoint that uses a route, query, or body id to read or modify an object
  and has no visible ownership, tenant, or authorization-service check. A query
  scoped by the authenticated user's stable identifier is a clean control.
example_vulnerable: |
  [HttpGet("orders/{id}")]
  public Task<Order?> Get(int id) => db.Orders.FindAsync(id).AsTask();
example_secure: |
  public Task<Order?> Get(int id) => db.Orders.SingleOrDefaultAsync(
      x => x.Id == id && x.OwnerId == User.GetUserId());
references:
  - url: https://cwe.mitre.org/data/definitions/639.html
    title: CWE-639 Authorization Bypass Through User-Controlled Key
  - url: https://owasp.org/Top10/A01_2021-Broken_Access_Control/
    title: OWASP A01 Broken Access Control
