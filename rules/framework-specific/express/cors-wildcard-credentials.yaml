id: cwe-942-cors-wildcard-credentials-express
taxonomy:
  - owasp: A05:2021
  - cwe: CWE-942
title: Overly Permissive CORS with Credentials
severity: high
languages:
  - javascript
  - typescript
frameworks:
  - express
description: |
  Reflecting an arbitrary Origin (or using "*") while also allowing
  credentials lets any website make authenticated cross-origin requests to
  the API using the victim's cookies, reading responses that should be
  same-origin only. Reflecting req.headers.origin unconditionally is
  equivalent to allowing all origins with credentials.
detection_criteria: |
  Flag credentialed CORS with an unrestricted origin:
  - cors({ origin: true, credentials: true }) or origin reflecting
    req.headers.origin with credentials enabled
  - res.setHeader('Access-Control-Allow-Origin', req.headers.origin) together
    with Access-Control-Allow-Credentials: true
  - '*' origin combined with credentials
  Safe: an explicit allowlist of trusted origins when credentials are enabled.
example_vulnerable: |
  app.use(cors({ origin: (o, cb) => cb(null, true), credentials: true }));
example_secure: |
  const ALLOWED = ['https://app.example.com'];
  app.use(cors({
    origin: (o, cb) => cb(null, ALLOWED.includes(o)),
    credentials: true,
  }));
references:
  - url: https://cwe.mitre.org/data/definitions/942.html
    title: CWE-942 Permissive Cross-domain Policy
  - url: https://owasp.org/Top10/A05_2021-Security_Misconfiguration/
    title: OWASP Top 10 A05 Security Misconfiguration
