id: cwe-798-express-hardcoded-session-secret
taxonomy:
  - owasp: A02:2021
  - cwe: CWE-798
title: Hardcoded express-session Secret
severity: high
languages:
  - javascript
  - typescript
frameworks:
  - express
description: |
  express-session signs the session id cookie with the configured secret.
  A hardcoded, committed, or trivial secret lets anyone who reads the source
  (or guesses a common value) forge valid session cookies and impersonate any
  user. The secret is the sole thing preventing session forgery.
detection_criteria: |
  Flag session/cookie signing secrets that are literals or weak:
  - session({ secret: 'keyboard cat' }) or any string literal secret
  - cookieParser('hardcoded-secret')
  - JWT/session secrets committed as constants
  Safe: load the secret from process.env with no literal fallback, and use a
  long random value.
example_vulnerable: |
  app.use(session({ secret: 'keyboard cat', resave: false }));
example_secure: |
  app.use(session({ secret: process.env.SESSION_SECRET, resave: false }));
references:
  - url: https://cwe.mitre.org/data/definitions/798.html
    title: CWE-798 Use of Hard-coded Credentials
  - url: https://owasp.org/Top10/A02_2021-Cryptographic_Failures/
    title: OWASP Top 10 A02 Cryptographic Failures
