[project]
name = "sentinel"
version = "0.1.0"
description = "Local, rules-grounded security reviewer for vibe-coded applications"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "pydantic>=2.7",
    "pyyaml>=6",
    "httpx>=0.27",
    "openai>=1.40",
    "langgraph>=0.2",
    "litellm[proxy]>=1.44",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "tree-sitter>=0.23",
    "tree-sitter-language-pack>=0.4",
    "redis>=5",
]

[project.scripts]
sentinel = "sentinel.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sentinel"]
# dashboard.html is loaded at runtime by sentinel/dashboard.py
artifacts = ["src/sentinel/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires live model backends and Postgres (deselect with '-m \"not integration\"')",
]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
