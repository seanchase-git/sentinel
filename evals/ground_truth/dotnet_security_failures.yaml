# Ground truth for AlexGoOn/the-most-vulnerable-dotnet-app (DotnetSecurityFailures)
#
# Second public benchmark target, and the first .NET one. Transcribed from the
# application's OWN documented vulnerability inventory (README.md, which lists
# every planted defect with its CWE and a link to the page that demonstrates it)
# BEFORE Sentinel was ever run against it. Nothing here was shaped by what
# Sentinel happened to find, which is the property that makes recall a
# measurement rather than a bound. Same discipline as evals/ground_truth/dvna.yaml.
#
# Clone: bash scripts/fetch-dotnet-benchmark.sh   (or: make benchmark-dotnet)
# Pinned at 60d060faf08079887e71a98498fe9a9d623e8ffc.
# 102 walker-eligible files (64 .razor, 37 .cs, 1 .js).
#
# HOW LOCATIONS WERE ESTABLISHED
#   The README links each defect to its demo page under Components/Pages/*.razor,
#   but that page is usually the teaching UI: it renders an explanation, prints a
#   sample of the vulnerable code, and calls a controller or service that holds
#   the real implementation. The location recorded below is the EXECUTABLE defect,
#   not the page that talks about it.
#
#   Every line here was confirmed executable with the project's own
#   graph/evidence.py:_node_is_non_executed check (tree-sitter, C# grammar for
#   @code bodies), so no entry points at documentation. That distinction is not
#   cosmetic: 53 of the 64 .razor files embed their own source as
#   `private const string VulnerableCode = """..."""` teaching material, and an
#   entry pointing at one of those would credit the reviewer for "finding" a
#   vulnerability in a page's printed explanation of that vulnerability.
#
# SCORING NOTE
#   evals/score.py matches on file + CWE class + line within LINE_TOLERANCE (40).
#   `corpus_coverage` records the covering rule id or `none`, so raw recall and
#   recall-over-covered can be reported separately, exactly as for DVNA. Report
#   both; raw recall alone conflates "had a rule and missed it" with "no rule".

target: ./benchmarks/the-most-vulnerable-dotnet-app
revision: 60d060faf08079887e71a98498fe9a9d623e8ffc
adjudicated_on: 2026-08-01
adjudicated_by: >
  Transcribed from README.md's documented inventory, then each defect located in
  source and confirmed to sit in executable code rather than in a displayed
  sample, using the repository's own executable-sink check.
exhaustive: false
exhaustive_note: >
  The README documents roughly fifty defects. The entries below are those whose
  executable implementation could be pinned to a specific line with confidence.
  Defects that exist only as demonstration prose, that are implemented purely in
  front-end JavaScript under wwwroot, or whose "vulnerability" is the absence of
  a control with no single anchoring line (missing rate limiting on every
  endpoint, negative-quantity and integer-overflow business logic) are NOT
  transcribed, because a location the scorer cannot match would depress recall
  for a reason unrelated to the reviewer's behaviour.
  exhaustive stays false regardless: the scorer's definition of exhaustive is
  that every unmatched finding is a proven false positive, which is a stronger
  claim than "the documented inventory is complete". An unmatched finding here
  may be a genuine defect the README never claimed.

