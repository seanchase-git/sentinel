expected_coverage_note: >
  Of the entries above, the majority are covered by a C# or ASP.NET Core rule in
  the current corpus (see each entry's `corpus_coverage`). Known corpus gaps at
  this revision: JSON/NoSQL query construction (CWE-91 via JSON operators),
  CRLF response splitting (CWE-93), privilege escalation by role assignment
  (CWE-269), password-reset host-header poisoning (CWE-640), directory listing
  (CWE-548), sensitive data in URLs (CWE-598), excessive data exposure
  (CWE-213), and missing rate limiting (CWE-799). Those should be read as corpus
  gaps rather than reasoning failures.

  False-positive controls this target exercises deliberately, because the app
  ships secure counterparts beside most defects: parameterised ADO.NET commands,
  an XmlReader with DtdProcessing.Prohibit and a null resolver, a real
  certificate-validation callback, a credential-free AllowAnyOrigin CORS policy,
  and — most importantly — 53 files that print their own vulnerable source as
  raw-string teaching material. A reviewer that flags the teaching material has
  not found a vulnerability; it has read the textbook.
